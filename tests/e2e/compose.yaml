# IRV_E2E_IMAGE picks a mirror where the default registry rate-limits this host's IP,
# e.g. public.ecr.aws/docker/library/python:3.12-slim.
services:
  default:
    image: ${IRV_E2E_IMAGE:-docker.io/library/python:3.12-slim}
    init: true
    command: tail -f /dev/null
    working_dir: /work
    network_mode: none
