[project]
name = "inspect-replay-verify"
version = "0.1.0"
description = "Independent replay verification for Inspect AI evals: re-run a sample's recorded tool calls in a fresh sandbox and score the observed effect"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Alexander Matt Turner" }]
keywords = ["inspect", "inspect-ai", "evals", "sandbox", "verification", "ai-control"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
# No ceiling: a handful of private inspect_ai symbols are imported, all of them in
# `inspect_replay_verify._inspect_compat`, which fails at import naming the symbol.
dependencies = ["inspect-ai>=0.3.245"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.10"]

[project.urls]
Source = "https://github.com/AlexanderMattTurner/inspect-replay-verify"

# Registers `replay_scorer` with Inspect, so `inspect score --scorer
# inspect_replay_verify/replay_scorer` resolves without an import in user code.
[project.entry-points.inspect_ai]
inspect_replay_verify = "inspect_replay_verify._registry"

# Third-party backends register adapters here; see README "Writing an adapter".
[project.entry-points.inspect_replay_verify]
glovebox = "inspect_replay_verify.adapters.glovebox:GloveboxAdapter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inspect_replay_verify"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
xfail_strict = true
# The e2e suites need a container runtime or KVM; CI runs each in its own job with `-m`.
addopts = "-m 'not docker and not glovebox'"
markers = [
    "docker: drives Inspect's real docker sandbox (needs a Docker daemon)",
    "glovebox: drives a real glovebox microVM (needs KVM and a provisioned glovebox host)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["glovebox_driver.*", "inspect_glovebox.*"]
ignore_missing_imports = true
