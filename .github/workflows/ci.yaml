name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv -p 3.13 && uv pip install -e ".[dev]"
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            inspect: "inspect-ai==0.3.245"   # the declared floor
          - python: "3.13"
            inspect: "inspect-ai"            # latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv -p ${{ matrix.python }} && uv pip install -e ".[dev]" "${{ matrix.inspect }}"
      - run: uv run --no-sync pytest -q
